name: Deployment Workflow
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
       tags:
        description: 'Write the description'
        required: true
        default: 'latest'
       image_name:
        description: 'Write the image name'
        required: true
        default: 'my-app'

jobs:
  deploy-on-EC2:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: docker login
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        if : contains(github.event.head_commit.modified, 'Frontend/Dockerfile') 
        uses: docker/build-push-action@v5.4.0
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ github.event.inputs.image_name }}:${{ github.event.inputs.tags }}
      - name: SSH into EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ env.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "Successfully connected to EC2!"
            docker --version
            sudo docker pull ${{ env.DOCKER_USERNAME }}/${{ github.event.inputs.image_name }}:${{ github.event.inputs.tags }}
            sudo docker rm -f my-app-container || true
            sudo docker run -d --name my-app-container -p 80:80 ${{ env.DOCKER_USERNAME }}/${{ github.event.inputs.image_name }}:${{ github.event.inputs.tags }}